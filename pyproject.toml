[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-policy"
dynamic = ["version"]
description = "A small diffusion policy with physical-time rotary attention"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.6.0", "numpy==1.26.4", "timm==1.0.14", "diffusers==0.33.1",
]

[project.optional-dependencies]
vision = ["transformers==4.48.3", "PyYAML>=6"]
simulation = [
    "chronos-policy[vision]",
    "mujoco==3.3.5", "dm-control==1.0.31", "mink==0.0.5", "qpsolvers[quadprog]",
    "scipy==1.15.1", "opencv-python==4.11.0.86", "zarr==2.18.3", "numcodecs==0.13.1",
    # Dependencies of the DexMimicGen tasks; see simulation/dexmimicgen/requirements.txt.
    "gym==0.23.1", "h5py==3.16.0", "numba==0.61.0", "imageio==2.37.2", "imageio-ffmpeg==0.6.0",
    "termcolor==3.3.0", "cloudpickle==3.1.2", "egl-probe==1.0.1", "cmake==3.31.6",
    "tensorboardX==2.6.4",
]

[tool.setuptools.packages.find]
include = ["chronos", "scripts", "simulation*"]

[tool.setuptools.package-data]
simulation = ["*/assets/**/*"]
scripts = ["paper_jobs.json"]
"simulation.dexmimicgen" = ["requirements.txt"]

[tool.setuptools.dynamic]
version = {attr = "chronos.__version__"}

[tool.black]
line-length = 100
